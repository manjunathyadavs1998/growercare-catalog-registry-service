# SPEC-PLAT-06 R76/R77 (ADR-017): environment-specific values come ONLY from the environment; the service refuses to
# start naming every missing variable (gc.required-properties). Variables: .env.example.
gc.required-properties: >-
  spring.datasource.url, spring.datasource.username, spring.datasource.password,
  spring.flyway.placeholders.cdc_role,
  spring.security.oauth2.resourceserver.jwt.issuer-uri, spring.security.oauth2.resourceserver.jwt.jwk-set-uri,
  spring.security.oauth2.client.registration.iam.client-id, spring.security.oauth2.client.registration.iam.client-secret,
  spring.security.oauth2.client.provider.keycloak.token-uri,
  gc.iam.base-url, spring.data.redis.host, spring.data.redis.password, gc.security.internal-clients,
  gc.catalog.import-clients

server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: catalog-registry-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  flyway:
    enabled: ${GC_MIGRATE:false}
    user: ${DB_OWNER_USER:}
    password: ${DB_OWNER_PASSWORD:}
    schemas: catalog
    default-schema: catalog
    create-schemas: true
    locations: ${GC_FLYWAY_LOCATIONS:classpath:db/migration}       # local: + classpath:db/dev-seed
    out-of-order: ${GC_FLYWAY_OUT_OF_ORDER:false}                  # SPEC-PLAT-04 R63: only with the dev seed
    placeholders:
      app_role: ${spring.datasource.username}
      cdc_role: ${GC_CDC_ROLE}

springdoc:
  api-docs:
    enabled: ${GC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${GC_API_DOCS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ---------------------------------------------------------------- security (skill: java-security-rbac)
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${OIDC_ISSUER_URI}
  jwk-set-uri: ${OIDC_JWKS_URI}
  audiences: gc-api,gc-internal

# Client-credentials token for IAM's /internal API (Keycloak client "catalog-registry-service", audience gc-internal).
spring.security.oauth2.client:
  registration:
    iam:
      provider: keycloak
      client-id: ${IAM_CLIENT_ID}
      client-secret: ${IAM_CLIENT_SECRET}
      authorization-grant-type: client_credentials
  provider:
    keycloak:
      token-uri: ${OIDC_TOKEN_URI}

# Redis: principal cache only (ADR-011).
spring.data.redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD}
  timeout: 500ms
  connect-timeout: 500ms

gc.iam:
  base-url: ${IAM_BASE_URL}
  connect-timeout: 1s
  read-timeout: 2s
gc.security:
  internal-clients: ${GC_INTERNAL_CLIENTS}        # service clients allowed on /internal/** (import + replica views)
  principal-cache-ttl: 5m
  cors-allowed-origins: ${GC_CORS_ALLOWED_ORIGINS:}
gc.catalog:
  import-clients: ${GC_IMPORT_CLIENTS}            # SPEC-CAT-01 D2/R16: who may write the catalog (ERP / regulatory sync)
